name: Test and release Windows build

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check and build web frontend
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run static analysis
        shell: pwsh
        run: |
          python -m ruff check src tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m mypy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(-beta)?$') {
            throw "VERSION must use MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-beta. Received: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          if ($version.EndsWith('-beta')) {
            "prerelease=true" >> $env:GITHUB_OUTPUT
          } else {
            "prerelease=false" >> $env:GITHUB_OUTPUT
          }

      - name: Check whether this version is already released
        if: github.ref == 'refs/heads/main'
        id: existing_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # `gh release view` returns 1 when the tag has no release yet.
          # That is the normal case for a new version, not a workflow error.
          $ErrorActionPreference = 'Continue'
          & gh release view $env:TAG --repo "${{ github.repository }}" *> $null
          $exists = $LASTEXITCODE -eq 0
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Build Windows distribution
        if: github.ref == 'refs/heads/main' && steps.existing_release.outputs.exists == 'false'
        shell: pwsh
        run: |
          dotnet publish tools/SolidWorksDrawingHelper/SolidWorksDrawingHelper.csproj -c Release -r win-x64 --self-contained true -p:UseInstalledInterop=false -o build/SolidWorksDrawingHelper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm palletlab.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm updater.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test frozen application
        if: github.ref == 'refs/heads/main' && steps.existing_release.outputs.exists == 'false'
        shell: pwsh
        run: |
          $smokeTest = Start-Process `
            -FilePath .\dist\PalletLab\PalletLab.exe `
            -ArgumentList "--smoke-test" `
            -Wait `
            -WindowStyle Hidden `
            -PassThru
          if ($smokeTest.ExitCode -ne 0) {
            if (Test-Path .\palletlab-smoke-test-error.log) {
              Get-Content .\palletlab-smoke-test-error.log
            }
            throw "The packaged PalletLab executable failed its import smoke test."
          }
          python tests/frozen_step_smoke.py dist/PalletLab/PalletLab.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        if: github.ref == 'refs/heads/main' && steps.existing_release.outputs.exists == 'false'
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Package distribution and calculate checksum
        if: github.ref == 'refs/heads/main' && steps.existing_release.outputs.exists == 'false'
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $updateName = "PalletLab-$env:VERSION-update.zip"
          $updatePath = Join-Path $PWD $updateName
          Compress-Archive -Path "dist\PalletLab", "dist\PalletLabUpdater" -DestinationPath $updatePath -CompressionLevel Optimal
          Compress-Archive -Path "dist\PalletLab" -DestinationPath "PalletLab-$env:VERSION-Portable.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash -Path $updatePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $updateName" | Set-Content -NoNewline "$updatePath.sha256"
          python tests/package_smoke.py "PalletLab-$env:VERSION-Portable.zip" $updatePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:APP_VERSION = $env:VERSION
          $env:APP_DIST = (Resolve-Path "dist\PalletLab")
          $env:UPDATER_DIST = (Resolve-Path "dist\PalletLabUpdater")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\PalletLab.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setupPath = Join-Path $PWD "installer\PalletLab-Setup-$env:VERSION.exe"
          "update_path=$updatePath" >> $env:GITHUB_OUTPUT
          "checksum_path=$updatePath.sha256" >> $env:GITHUB_OUTPUT
          "portable_path=$PWD\PalletLab-$env:VERSION-Portable.zip" >> $env:GITHUB_OUTPUT
          "setup_path=$setupPath" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        if: github.ref == 'refs/heads/main' && steps.existing_release.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          UPDATE_PATH: ${{ steps.package.outputs.update_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
          PORTABLE_PATH: ${{ steps.package.outputs.portable_path }}
          SETUP_PATH: ${{ steps.package.outputs.setup_path }}
        run: |
          $arguments = @(
            'release', 'create', $env:TAG,
            '--repo', '${{ github.repository }}',
            '--title', "PalletLab $env:VERSION",
            '--generate-notes',
            $env:UPDATE_PATH, $env:CHECKSUM_PATH, $env:PORTABLE_PATH, $env:SETUP_PATH
          )
          if ($env:PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          }
          & gh @arguments
