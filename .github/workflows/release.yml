name: Test and release Windows build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(-beta)?$') {
            throw "VERSION must use MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-beta. Received: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          if ($version.EndsWith('-beta')) {
            "prerelease=true" >> $env:GITHUB_OUTPUT
          } else {
            "prerelease=false" >> $env:GITHUB_OUTPUT
          }

      - name: Check whether this version is already released
        id: existing_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # `gh release view` returns 1 when the tag has no release yet.
          # That is the normal case for a new version, not a workflow error.
          $ErrorActionPreference = 'Continue'
          & gh release view $env:TAG --repo "${{ github.repository }}" *> $null
          $exists = $LASTEXITCODE -eq 0
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Build Windows distribution
        if: steps.existing_release.outputs.exists == 'false'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm palletlab.spec
          python -m PyInstaller --noconfirm updater.spec

      - name: Install Inno Setup
        if: steps.existing_release.outputs.exists == 'false'
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Package distribution and calculate checksum
        if: steps.existing_release.outputs.exists == 'false'
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $updateName = "PalletLab-$env:VERSION-update.zip"
          $updatePath = Join-Path $PWD $updateName
          Compress-Archive -Path "dist\PalletLab", "dist\PalletLabUpdater" -DestinationPath $updatePath -CompressionLevel Optimal
          Compress-Archive -Path "dist\PalletLab" -DestinationPath "PalletLab-$env:VERSION-Portable.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash -Path $updatePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $updateName" | Set-Content -NoNewline "$updatePath.sha256"
          $env:APP_VERSION = $env:VERSION
          $env:APP_DIST = (Resolve-Path "dist\PalletLab")
          $env:UPDATER_DIST = (Resolve-Path "dist\PalletLabUpdater")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\PalletLab.iss"
          $setupPath = Join-Path $PWD "installer\PalletLab-Setup-$env:VERSION.exe"
          "update_path=$updatePath" >> $env:GITHUB_OUTPUT
          "checksum_path=$updatePath.sha256" >> $env:GITHUB_OUTPUT
          "portable_path=$PWD\PalletLab-$env:VERSION-Portable.zip" >> $env:GITHUB_OUTPUT
          "setup_path=$setupPath" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        if: steps.existing_release.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          UPDATE_PATH: ${{ steps.package.outputs.update_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
          PORTABLE_PATH: ${{ steps.package.outputs.portable_path }}
          SETUP_PATH: ${{ steps.package.outputs.setup_path }}
        run: |
          $arguments = @(
            'release', 'create', $env:TAG,
            '--repo', '${{ github.repository }}',
            '--title', "PalletLab $env:VERSION",
            '--generate-notes',
            $env:UPDATE_PATH, $env:CHECKSUM_PATH, $env:PORTABLE_PATH, $env:SETUP_PATH
          )
          if ($env:PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          }
          & gh @arguments
